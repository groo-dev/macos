name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain: macos-latest's DEFAULT xcodebuild has drifted to an
      # older Xcode (16.4) whose stricter Swift-6 concurrency checking made the
      # archive nondeterministically red. Prefer Xcode 26.4.x; fall back to the
      # newest installed so the release never fails purely on toolchain
      # selection. The chosen version is printed for the record.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "Xcode 26.4.x not found; using newest installed. Available:"
            ls -d /Applications/Xcode_*.app
            XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Get version
        id: version
        uses: groo-dev/record-release@v1
        with:
          token: ${{ secrets.OPS_API_TOKEN }}
          environment: production
          bump: patch
          bump-build: true
          artifacts: Groo-*.dmg

      - name: Import certificate and profiles
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PROFILE_EXTENSION: ${{ secrets.PROVISIONING_PROFILE_EXTENSION }}
        run: |
          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$PROFILE_APP" | base64 --decode > /tmp/app.mobileprovision
          echo "$PROFILE_EXTENSION" | base64 --decode > /tmp/extension.mobileprovision

          # Extract UUIDs and install with UUID as filename
          APP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i /tmp/app.mobileprovision))
          EXT_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i /tmp/extension.mobileprovision))

          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$APP_UUID.mobileprovision
          cp /tmp/extension.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$EXT_UUID.mobileprovision

          echo "APP_PROFILE_UUID=$APP_UUID" >> $GITHUB_ENV
          echo "EXT_PROFILE_UUID=$EXT_UUID" >> $GITHUB_ENV

      - name: Set version
        # Passed through env, never expanded into the script text. This job
        # imports Apple signing certificates and provisioning profiles, so a
        # value that reached bash as code would run with signing material in
        # the keychain. The values come from our own API today; that is a
        # reason they are trustworthy now, not a reason to interpolate them.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          # Fail here rather than in xcodebuild. An empty or non-numeric build
          # would make agvtool set a nonsense CURRENT_PROJECT_VERSION and the
          # archive would fail much later, pointing at the wrong thing.
          case "$BUILD" in
            ''|*[!0-9]*)
              echo "::error::ops returned no usable build number ('$BUILD') - is bump-build set on the Get version step?"
              exit 1
              ;;
          esac
          agvtool new-marketing-version "$VERSION"
          agvtool new-version -all "$BUILD"

      - name: Build and archive
        run: |
          xcodebuild archive \
            -project Groo.xcodeproj \
            -scheme Groo \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Groo.xcarchive

      - name: Export app
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Groo.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$RUNNER_TEMP/export/Groo.app"

          ditto -c -k --keepParent "$APP_PATH" $RUNNER_TEMP/Groo.zip

          xcrun notarytool submit $RUNNER_TEMP/Groo.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APP_PATH="$RUNNER_TEMP/export/Groo.app"

          mkdir -p $RUNNER_TEMP/dmg-staging
          cp -R "$APP_PATH" $RUNNER_TEMP/dmg-staging/
          ln -s /Applications $RUNNER_TEMP/dmg-staging/Applications

          hdiutil create \
            -volname "Groo" \
            -srcfolder $RUNNER_TEMP/dmg-staging \
            -ov \
            -format UDZO \
            "Groo-${VERSION}.dmg"

      - name: Update Homebrew tap
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG_FILE="Groo-${VERSION}.dmg"

          # Compute SHA256 from local DMG
          SHA256=$(shasum -a 256 "$DMG_FILE" | cut -d' ' -f1)

          # Clone homebrew tap
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/groo-dev/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          # Create Casks directory if needed
          mkdir -p Casks

          # Create cask formula
          cat > Casks/groo-mac.rb << EOF
          cask "groo-mac" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/groo-dev/macos/releases/download/v#{version}/Groo-#{version}.dmg"
            name "Groo"
            desc "Menu bar clipboard manager and quick capture tool"
            homepage "https://github.com/groo-dev/macos"

            app "Groo.app"

            zap trash: [
              "~/Library/Application Support/Groo",
              "~/Library/Preferences/dev.groo.mac.plist",
              "~/Library/Caches/dev.groo.mac",
            ]
          end
          EOF

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/
          git commit -m "Update groo-mac to $VERSION"
          git push
